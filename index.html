<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Brain Sludge - DVD Menu</title>

<link rel="icon" type="image/png" href="Neocties/Imgs/eggyd.png">

<style>

/* =========================================================
   HTML BRAIN SLUDGE
   BOOTLEG DVD MENU
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   MAIN DVD SCREEN
   ========================================================= */

.dvd-screen {

    position: relative;

    width: 100%;
    min-height: 100vh;

    overflow: hidden;

    /*
       Cheap DVD-menu-looking background
    */

    background:
        radial-gradient(
            ellipse at center,
            #333333 0%,
            #171717 45%,
            #050505 100%
        );

}


/* =========================================================
   FAKE DVD MENU LIGHT
   ========================================================= */

.dvd-screen::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,0.10),
            transparent 55%
        );

    z-index: 1;
}


/* =========================================================
   SCANLINES
   ========================================================= */

.dvd-screen::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 50;

}


/* =========================================================
   DVD LOGO / TITLE
   ========================================================= */
.logo {

    position: absolute;

    top: 7vh;
    left: 50%;

    transform: translateX(-50%);

    width: min(970px, 65vw);

    height: auto;

    z-index: 10;

    animation: logoSludge 4s ease-in-out infinite;

}

   @keyframes logoSludge {

    0%,
    100% {

        transform: translateX(-50%) translateY(0px) rotate(-1deg);

        filter:
            drop-shadow(0 0 5px rgba(255,255,255,0.20))
            drop-shadow(5px 5px 0 #000);

    }

    50% {

        transform: translateX(-50%) translateY(-6px) rotate(1deg);

        filter:
            drop-shadow(0 0 14px rgba(255,255,255,0.35))
            drop-shadow(7px 7px 0 #000);

    }

}

/* =========================================================
   GIANT FAKE DVD DISC
   ========================================================= */

.dvd-disc {

    position: absolute;

    width: min(520px, 42vw);
    aspect-ratio: 1;

    right: -120px;
    top: 18%;

    border-radius: 50%;

    /*
       Fake reflective DVD
    */

    background:
        conic-gradient(
            from 0deg,
            #ff004c,
            #00d9ff,
            #7b00ff,
            #ffef00,
            #00ff88,
            #ff004c
        );

    opacity: 0.22;

    filter:
        blur(1px)
        saturate(1.4);

    transform: rotate(-20deg);

    z-index: 2;

}


/* DVD center hole */

.dvd-disc::after {

    content: "";

    position: absolute;

    width: 18%;

    aspect-ratio: 1;

    border-radius: 50%;

    background: #151515;

    border: 4px solid rgba(255,255,255,0.25);

    top: 41%;
    left: 41%;

}


/* =========================================================
   MENU
   ========================================================= */

.menu {

    position: absolute;

    left: 12%;

    top: 43%;

    z-index: 20;

    width: 360px;

}


/* =========================================================
   MENU ITEMS
   ========================================================= */

.menu a {

    display: block;

    width: fit-content;

    margin: 13px 0;

    padding: 7px 18px;

    color: white;

    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 1px;

    text-transform: uppercase;

    text-shadow:
        3px 3px 0 #000;

    transition:
        transform 0.08s,
        color 0.08s,
        background 0.08s;

}


/* =========================================================
   DVD MENU HOVER / SELECTION
   ========================================================= */

.menu a:hover {

    color: #ffff00;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.18),
            transparent
        );

    transform: translateX(18px);

}


/* Fake DVD arrow */

.menu a::before {

    content: "▶ ";

    color: #aaa;

}


.menu a:hover::before {

    color: #ffff00;

}


/* =========================================================
   SMALL "DISC MENU" LABEL
   ========================================================= */

.menu-title {

    margin-bottom: 22px;

    color: #ddd;

    font-family: monospace;

    font-size: 14px;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-shadow:
        2px 2px 0 #000;

}


/* =========================================================
   FAKE DVD PLAYER UI
   ========================================================= */

.dvd-bar {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;

    height: 75px;

    background:
        linear-gradient(
            180deg,
            #242424,
            #080808
        );

    border-top: 2px solid #555;

    z-index: 30;

}


/* =========================================================
   DVD VIDEO LOGO
   ========================================================= */

.dvd-video {

    position: absolute;

    left: 30px;
    bottom: 20px;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 24px;

    font-weight: bold;

    font-style: italic;

    color: #ddd;

    text-shadow:
        2px 2px 0 #000;

}


/* =========================================================
   FAKE COPYRIGHT TEXT
   ========================================================= */

.copyright {

    position: absolute;

    right: 30px;
    bottom: 24px;

    color: #777;

    font-family: monospace;

    font-size: 10px;

    text-align: right;

}


/* =========================================================
   RANDOM DVD WARNING
   ========================================================= */

.warning {

    position: absolute;

    right: 50px;
    bottom: 115px;

    z-index: 20;

    font-family: monospace;

    font-size: 11px;

    color: #777;

    transform: rotate(-2deg);

}


/* =========================================================
   DVD MENU FOOTER
   ========================================================= */

.disc-info {

    position: absolute;

    bottom: 95px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: #666;

    font-family: monospace;

    font-size: 10px;

    letter-spacing: 2px;

    white-space: nowrap;

}


/* =========================================================
   LITTLE "LOADING" LIGHT
   ========================================================= */

.led {

    position: absolute;

    right: 32px;
    top: 28px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: red;

    box-shadow:
        0 0 8px red;

    animation: blink 1.4s infinite;

    z-index: 40;

}


@keyframes blink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0.25;
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .logo {

        width: 85vw;

        top: 6vh;

    }


    .menu {

        left: 8%;

        top: 42%;

        width: 85%;

    }


    .menu a {

        font-size: 20px;

    }


    .dvd-disc {

        width: 400px;

        right: -200px;

        opacity: 0.15;

    }


    .copyright {

        display: none;

    }

}


</style>

</head>
