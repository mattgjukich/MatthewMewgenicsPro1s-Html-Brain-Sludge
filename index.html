<!DOCTYPE html>

<head>

<style>

/* =========================================================
   HTML BRAIN SLUDGE
   BOOTLEG DVD MENU
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   MAIN DVD SCREEN
   ========================================================= */

.dvd-screen {

    position: relative;

    width: 100%;
    min-height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #333333 0%,
            #171717 45%,
            #050505 100%
        );

}


/* =========================================================
   FAKE DVD MENU LIGHT
   ========================================================= */

.dvd-screen::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,0.10),
            transparent 55%
        );

    z-index: 1;

}


/* =========================================================
   SCANLINES
   ========================================================= */

.dvd-screen::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 50;

}


/* =========================================================
   DVD LOGO
   ========================================================= */

.logo {

    position: absolute;

    top: 7vh;
    left: 50%;

    transform: translateX(-50%);

    width: min(970px, 65vw);

    height: auto;

    z-index: 10;

    animation: logoSludge 4s ease-in-out infinite;

}


@keyframes logoSludge {

    0%,
    100% {

        transform:
            translateX(-50%)
            translateY(0px)
            rotate(-1deg);

        filter:
            drop-shadow(0 0 5px rgba(255,255,255,0.20))
            drop-shadow(5px 5px 0 #000);

    }

    50% {

        transform:
            translateX(-50%)
            translateY(-6px)
            rotate(1deg);

        filter:
            drop-shadow(0 0 14px rgba(255,255,255,0.35))
            drop-shadow(7px 7px 0 #000);

    }

}


/* =========================================================
   GIANT FAKE DVD DISC
   ========================================================= */

.dvd-disc {

    position: absolute;

    width: min(520px, 42vw);
    aspect-ratio: 1;

    right: -120px;
    top: 18%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            #ff004c,
            #00d9ff,
            #7b00ff,
            #ffef00,
            #00ff88,
            #ff004c
        );

    opacity: 0.22;

    filter:
        blur(1px)
        saturate(1.4);

    transform: rotate(-20deg);

    z-index: 2;

}


.dvd-disc::after {

    content: "";

    position: absolute;

    width: 18%;

    aspect-ratio: 1;

    border-radius: 50%;

    background: #151515;

    border: 4px solid rgba(255,255,255,0.25);

    top: 41%;
    left: 41%;

}


/* =========================================================
   MENU
   ========================================================= */

.menu {

    position: absolute;

    left: 12%;

    top: 43%;

    z-index: 20;

    width: 450px;

}


/* =========================================================
   MENU ITEMS
   ========================================================= */

.menu-item {

    display: flex;

    align-items: center;

    width: fit-content;

    margin: 13px 0;

    padding: 7px 18px;

    color: white;

    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 1px;

    text-transform: uppercase;

    text-shadow:
        3px 3px 0 #000;

    cursor: pointer;

    transition:
        transform 0.12s,
        color 0.12s,
        background 0.12s;

}


/* =========================================================
   ICONS
   ========================================================= */

.menu-icon {

    display: block;

    width: 42px;
    height: 42px;

    margin-right: 8px;

    object-fit: contain;

    filter:
        drop-shadow(2px 2px 0 #000);

    transition:
        transform 0.15s,
        filter 0.15s;

}

/* =========================================================
   HOVER EFFECT
   ========================================================= */

.menu-item:hover {

    color: #ffff00;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.18),
            transparent
        );

    transform: translateX(18px);

}


.menu-item:hover .menu-icon {

    transform:
        rotate(-8deg)
        scale(1.25);

    filter:
        drop-shadow(0 0 7px #ffff00)
        drop-shadow(2px 2px 0 #000);

}


/* Fake DVD arrow */

.menu-item::before {

    content: "▶";

    margin-right: 10px;

    color: #888;

    transition:
        color 0.12s,
        transform 0.12s;

}


.menu-item:hover::before {

    color: #ffff00;

    transform: translateX(3px);

}


/* =========================================================
   SMALL "DISC MENU" LABEL
   ========================================================= */

.menu-title {

    margin-bottom: 22px;

    color: #ddd;

    font-family: monospace;

    font-size: 14px;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-shadow:
        2px 2px 0 #000;

}


/* =========================================================
   PROJECT INFORMATION WINDOW
   ========================================================= */

dialog.project-window {

    width: min(650px, 90vw);

    padding: 0;

    border: 4px solid #777;

    background:
        linear-gradient(
            180deg,
            #303030,
            #111111
        );

    color: white;

    box-shadow:
        12px 12px 0 #000,
        0 0 30px rgba(0,0,0,0.8);

    font-family: Arial, Helvetica, sans-serif;

    z-index: 100;

}


dialog.project-window::backdrop {

    background:
        rgba(0,0,0,0.72);

    backdrop-filter:
        blur(2px);

}


/* =========================================================
   WINDOW TITLE BAR
   ========================================================= */

.window-titlebar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 9px 12px;

    background:
        linear-gradient(
            180deg,
            #555,
            #222
        );

    border-bottom: 3px solid #111;

    font-family: monospace;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 1px;

}


.window-x {

    color: white;

    background: #8b0000;

    border: 2px solid #aaa;

    width: 25px;
    height: 25px;

    font-weight: bold;

    cursor: pointer;

}


.window-x:hover {

    background: red;

}


/* =========================================================
   WINDOW CONTENT
   ========================================================= */

.window-content {

    padding: 24px;

}


.window-icon {

    float: left;

    font-size: 58px;

    margin-right: 20px;

    filter:
        drop-shadow(3px 3px 0 #000);

}


.window-content h2 {

    margin-top: 5px;

    margin-bottom: 10px;

    color: #ffff00;

    font-size: 25px;

    text-shadow:
        3px 3px 0 #000;

}


.window-description {

    clear: both;

    padding-top: 20px;

    color: #ddd;

    line-height: 1.5;

    font-size: 16px;

}


/* =========================================================
   STATUS BOX
   ========================================================= */

.status-box {

    margin-top: 20px;

    padding: 12px;

    background: #080808;

    border: 2px solid #444;

    font-family: monospace;

}


.status-label {

    color: #888;

    font-size: 11px;

}


.status-value {

    margin-top: 5px;

    color: #00ff66;

    font-weight: bold;

}


.file-location {

    margin-top: 12px;

    color: #aaa;

    font-size: 12px;

}


/* =========================================================
   WINDOW BUTTONS
   ========================================================= */

.window-buttons {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 25px;

}


.dvd-button {

    min-width: 120px;

    padding: 10px 20px;

    border: 3px outset #888;

    background:
        linear-gradient(
            180deg,
            #555,
            #222
        );

    color: white;

    font-family: monospace;

    font-weight: bold;

    cursor: pointer;

    text-transform: uppercase;

}


.dvd-button:hover {

    color: #ffff00;

    border-color: #ffff00;

}


.dvd-button:active {

    border-style: inset;

}


/* =========================================================
   FAKE DVD PLAYER UI
   ========================================================= */

.dvd-bar {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;

    height: 75px;

    background:
        linear-gradient(
            180deg,
            #242424,
            #080808
        );

    border-top: 2px solid #555;

    z-index: 30;

}


/* =========================================================
   DVD VIDEO LOGO
   ========================================================= */

.dvd-video {

    position: absolute;

    left: 30px;
    bottom: 20px;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 24px;

    font-weight: bold;

    font-style: italic;

    color: #ddd;

    text-shadow:
        2px 2px 0 #000;

}


/* =========================================================
   COPYRIGHT
   ========================================================= */

.copyright {

    position: absolute;

    right: 30px;
    bottom: 24px;

    color: #777;

    font-family: monospace;

    font-size: 10px;

    text-align: right;

}


/* =========================================================
   WARNING
   ========================================================= */

.warning {

    position: absolute;

    right: 50px;
    bottom: 115px;

    z-index: 20;

    font-family: monospace;

    font-size: 11px;

    color: #777;

    transform: rotate(-2deg);

}


/* =========================================================
   DVD INFO
   ========================================================= */

.disc-info {

    position: absolute;

    bottom: 95px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: #666;

    font-family: monospace;

    font-size: 10px;

    letter-spacing: 2px;

    white-space: nowrap;

}


/* =========================================================
   LITTLE LOADING LIGHT
   ========================================================= */

.led {

    position: absolute;

    right: 32px;
    top: 28px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: red;

    box-shadow:
        0 0 8px red;

    animation: blink 1.4s infinite;

    z-index: 40;

}


@keyframes blink {

    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0.25;
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .logo {

        width: 85vw;

        top: 6vh;

    }


    .menu {

        left: 8%;

        top: 42%;

        width: 85%;

    }


    .menu-item {

        font-size: 20px;

    }


    .dvd-disc {

        width: 400px;

        right: -200px;

        opacity: 0.15;

    }


    .copyright {

        display: none;

    }


    .disc-info {

        display: none;

    }

}


/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .logo {

        animation: none;

    }

}


/* =========================================================
   END CSS
   ========================================================= */

</style>

</head>

<script>

/* =========================================================
   PROJECT DATABASE
   ========================================================= */

const projects = {

    krackerkids: {

        title: "KRACKERKIDS AWFUL ODDITIES",

        icon: "",

        description:
            "The original KrackerKids Awful Oddities website. " +
            "A collection of completely unnecessary HTML garbage, " +
            "weird experiments, strange objects and other internet nonsense.",

        status:
            "PROJECT IS DEAD RIGHT NOW.",

        file:
            "Neocities/index1.html",

        music:
            "Music/wantugone.mp4"

    },


    krackphone: {

        title: "KRACKPHONE",

        icon: "",

        description:
            "KrackPhone. A completely unnecessary telephone-themed " +
            "piece of HTML Brain Sludge.",

        status:
            "STILL ALIVE.",

        file:
            "Neocities/krackphone.html",

        music:
            "Music/lemdema.mp4"

    }

};


/* =========================================================
   CURRENT PROJECT
   ========================================================= */

let currentProject = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const projectWindow =
    document.getElementById("projectWindow");

const projectMusic =
    document.getElementById("projectMusic");

const windowTitle =
    document.getElementById("windowTitle");

const windowIcon =
    document.getElementById("windowIcon");

const projectName =
    document.getElementById("projectName");

const projectDescription =
    document.getElementById("projectDescription");

const projectStatus =
    document.getElementById("projectStatus");

const projectFile =
    document.getElementById("projectFile");


/* =========================================================
   OPEN PROJECT WINDOW
   ========================================================= */

function openProject(projectID) {

    const project = projects[projectID];

    if (!project) {
        return;
    }

    currentProject = project;


    /* Update window */

    windowTitle.textContent =
        project.title;

    windowIcon.textContent =
        project.icon;

    projectName.textContent =
        project.title;

    projectDescription.textContent =
        project.description;

    projectStatus.textContent =
        project.status;

    projectFile.textContent =
        "FILE: " + project.file;


    /* =====================================================
       START PROJECT MUSIC
       ===================================================== */

    projectMusic.pause();

    projectMusic.currentTime = 0;

    projectMusic.src =
        project.music;


    /*
       Browsers normally allow audio started from
       a user click, which is exactly what this is.
    */

    projectMusic.play().catch(() => {

        console.log(
            "Music could not autoplay."
        );

    });


    /* =====================================================
       OPEN THE DVD WINDOW
       ===================================================== */

    projectWindow.showModal();

}


/* =========================================================
   OPEN PROJECT
   ========================================================= */

function openCurrentProject() {

    if (!currentProject) {
        return;
    }


    /* Stop music before leaving */

    projectMusic.pause();

    projectMusic.currentTime = 0;


    /* Go to the actual existing HTML page */

    window.location.href =
        currentProject.file;

}


/* =========================================================
   CLOSE PROJECT
   ========================================================= */

function closeProject() {

    projectMusic.pause();

    projectMusic.currentTime = 0;

    projectWindow.close();

}


/* =========================================================
   ESCAPE KEY
   ========================================================= */

projectWindow.addEventListener(
    "close",
    () => {

        projectMusic.pause();

        projectMusic.currentTime = 0;

    }
);


/* =========================================================
   PREVENT MUSIC FROM CONTINUING AFTER ESC
   ========================================================= */

projectWindow.addEventListener(
    "cancel",
    () => {

        projectMusic.pause();

        projectMusic.currentTime = 0;

    }
);

</script>
