<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Brain Sludge</title>

<link rel="icon" type="image/png" href="eggyd.png">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   THE ENTIRE HOMEPAGE
   ===================================================== */

.room {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =====================================================
   YOUR ACTUAL ROOM PHOTO
   ===================================================== */

.room-photo {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 100%;
    height: 100%;

    transform: translate(-50%, -50%);

    object-fit: cover;

    user-select: none;
    pointer-events: none;
}


/* =====================================================
   LOGO
   ===================================================== */

/*
   This sits ON TOP OF THE WALL in the photograph.

   You'll probably adjust these numbers after seeing
   it in the browser.
*/

.logo {
    position: absolute;

    width: 38%;

    max-width: 650px;

    right: 5%;
    top: 18%;

    height: auto;

    z-index: 10;

    pointer-events: none;

    user-select: none;
}


/* =====================================================
   CLICKABLE SHELF OBJECTS
   ===================================================== */

.shelf-object {
    position: absolute;

    display: block;

    z-index: 20;

    cursor: pointer;

    /*
       Makes the clickable objects feel like actual
       things sitting on the shelf.
    */

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}


.shelf-object img {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
}


/* Hover effect */

.shelf-object:hover {

    transform:
        scale(1.08)
        rotate(-2deg);

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 12px lime);
}


/* =====================================================
   EXAMPLE OBJECT POSITIONS
   ===================================================== */

/*
   THESE ARE JUST STARTING POSITIONS.

   We'll move them around after you actually make
   the objects.
*/


.steven {

    /*
       x position
    */
    left: 18%;

    /*
       y position
    */
    top: 48%;

    width: 90px;
}


.isaac {

    left: 28%;
    top: 60%;

    width: 75px;
}


.computer {

    left: 10%;
    top: 25%;

    width: 100px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 700px) {

    .room-photo {

        /*
           On phones, cover can crop the shelf heavily.
           This keeps the image centered.
        */

        object-position: center;
    }

    .logo {

        width: 45%;

        right: 3%;
        top: 15%;
    }

}

</style>
</head>


<body>


<main class="room">


    <!-- =================================================
         THE ACTUAL ROOM
         ================================================= -->

    <img
        src="theshelf.jpg"
        class="room-photo"
        alt=""
    >


    <!-- =================================================
         LOGO ON THE WALL
         ================================================= -->

    <img
        src="logotake1.gif"
        class="logo"
        alt="HTML Brain Sludge"
    >


    <!-- =================================================
         SHELF OBJECTS
         
         These are the navigation.
         No nav bar required.
         ================================================= -->


    <!-- Mewgenics -->

    <a
        href="mewgenics.html"
        class="shelf-object steven"
    >

        <img
            src="Imgs/steven.png"
            alt="Mewgenics"
        >

    </a>


    <!-- Isaac -->

    <a
        href="isaac.html"
        class="shelf-object isaac"
    >

        <img
            src="Imgs/isaac.png"
            alt="The Binding of Isaac"
        >

    </a>


    <!-- Another project -->

    <a
        href="projects.html"
        class="shelf-object computer"
    >

        <img
            src="Imgs/computer.png"
            alt="Projects"
        >

    </a>


</main>


</body>
</html>
