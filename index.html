<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Brain Sludge</title>

<link rel="icon" type="image/png" href="eggyd.png">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #111;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =========================
   MAIN SHELF / HERO
   ========================= */

.room {
    position: relative;
    width: 100%;
    min-height: 100vh;

    /* The wall behind everything */
    background: #d9d9d9;

    overflow: hidden;
}

/* THE ACTUAL PHOTO */
.room-photo {
    display: block;

    width: 100%;
    height: 100vh;

    object-fit: contain;
    object-position: left center;

    position: absolute;
    left: 0;
    top: 0;

    z-index: 1;
}

/* BIG LOGO ON THE EMPTY WALL */
.logo {
    position: absolute;

    /*
       Bigger than before, but still leaves the
       shelf as the main thing you notice.
    */
    width: min(28vw, 620px);

    height: auto;

    right: 5vw;
    top: 12vh;

    z-index: 5;

    pointer-events: none;
}

/* =========================
   STUFF THAT WILL EVENTUALLY
   SIT ON THE REAL SHELF
   ========================= */

.shelf-object {
    position: absolute;
    z-index: 10;

    display: block;
}

.shelf-object img {
    display: block;
    width: 100%;
    height: auto;
}

/* =========================
   BELOW THE PHOTO
   ========================= */

.below-shelf {
    position: relative;

    min-height: 1000px;

    padding: 50px 30px;

    /*
       Balatro-ish background:
       dark base + subtle radial glow +
       diagonal pattern
    */
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,0.12),
            transparent 35%
        ),
        repeating-linear-gradient(
            135deg,
            #17131f 0px,
            #17131f 8px,
            #21192b 8px,
            #21192b 10px
        );

    color: white;

    text-align: center;

    border-top: 4px solid #111;

    z-index: 20;
}

.below-shelf h2 {
    font-family: monospace;
    font-size: 28px;
    margin-bottom: 30px;

    text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000;
}

/* Blinkies / stamps area */

.chaos-content {
    max-width: 1400px;
    margin: auto;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 15px;
}

</style>
</head>


<body>

    <!-- =========================
         THE SHELF IS THE HOMEPAGE
         ========================= -->

    <main class="room">

        <!-- YOUR ACTUAL PHOTO -->
        <img
            src="theshelf.jpg"
            class="room-photo"
            alt="The HTML Brain Sludge shelf"
        >

        <!-- LOGO ON THE WALL -->
        <img
            src="logotake1.gif"
            class="logo"
            alt="MatthewMewgenicsPro1s Brain Sludge"
        >


        <!--
        =====================================================
        ACTUAL CLICKABLE SHELF OBJECTS GO HERE

        Example:

        <a href="whatever-page-you-actually-have.html"
           class="shelf-object"
           style="left: 20%; top: 50%; width: 120px;">

            <img src="whatever.png" alt="...">

        </a>

        =====================================================
        -->

    </main>


    <!-- =========================
         EVERYTHING AFTER SHELF
         ========================= -->

    <section class="below-shelf">

        <h2>HTML BRAIN SLUDGE HAS ESCAPED</h2>

        <div class="chaos-content">

            <p>
                blah text and random shit and blinkies and stamps and widgets
            </p>

            <!-- YOUR EXISTING BLINKIES/STAMPS GO HERE -->

        </div>

    </section>

</body>

</html>
