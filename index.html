<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Brain Sludge</title>

<link rel="icon" type="image/png" href="eggyd.png">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #111;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =========================
   MAIN SHELF / HERO
   ========================= */

.room {
    position: relative;

    width: 100%;
    height: 100vh;

    /*
       This is the wall behind the photo.
       The photo itself keeps its 4:3 ratio.
    */
    background: #d9d9d9;

    overflow: hidden;
}


/* =========================
   THE ACTUAL SHELF PHOTO
   ========================= */

.room-photo {

    /*
       IMPORTANT:
       Only the HEIGHT is controlled.

       The width becomes automatic based
       on the original 4080 x 3060 ratio.

       4080 / 3060 = 4 / 3
    */

    position: absolute;

    height: 100vh;
    width: auto;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    display: block;

    z-index: 1;
}


/* =========================
   BIG LOGO ON THE WALL
   ========================= */

.logo {
    position: absolute;

    /*
       Bigger than before.
       This should actually feel like
       something sitting on the wall.
    */

    width: min(28vw, 600px);

    height: auto;

    right: 7%;
    top: 12%;

    z-index: 5;

    pointer-events: none;
}


/* =========================
   STUFF THAT WILL EVENTUALLY
   SIT ON THE REAL SHELF
   ========================= */

.shelf-object {
    position: absolute;

    z-index: 10;

    display: block;
}

.shelf-object img {
    display: block;

    width: 100%;
    height: auto;
}


/* =========================
   BELOW THE SHELF
   ========================= */

.below-shelf {

    position: relative;

    /*
       This gives us the little bit of
       scrolling you wanted.
    */

    min-height: 1000px;

    padding: 50px 30px;


    /*
       BALATRO-ISH BACKGROUND

       Dark purple/black base
       + subtle glow
       + diagonal pattern
    */

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,0.12),
            transparent 35%
        ),

        repeating-linear-gradient(
            135deg,

            #17131f 0px,
            #17131f 8px,

            #21192b 8px,
            #21192b 10px
        );


    color: white;

    text-align: center;

    border-top: 4px solid #111;

    z-index: 20;
}


/* =========================
   BELOW-SHELF TITLE
   ========================= */

.below-shelf h2 {

    font-family: monospace;

    font-size: 28px;

    margin-bottom: 30px;

    text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000;
}


/* =========================
   BLINKIES / STAMPS AREA
   ========================= */

.chaos-content {

    max-width: 1400px;

    margin: auto;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 15px;
}


/* =========================
   OPTIONAL:
   PREVENT IMAGES FROM
   ACCIDENTALLY OVERFLOWING
   ========================= */

.chaos-content img {
    max-width: 100%;
    height: auto;
}

</style>
</head>


<body>


    <!-- =================================================
         THE SHELF IS THE HOMEPAGE
         ================================================= -->

    <main class="room">


        <!-- =============================================
             YOUR ACTUAL 4080 x 3060 PHOTO
             ============================================= -->

        <img
            src="theshelf.jpg"
            class="room-photo"
            alt="The HTML Brain Sludge shelf"
        >


        <!-- =============================================
             LOGO ON THE WALL
             ============================================= -->

        <img
            src="logotake1.gif"
            class="logo"
            alt="MatthewMewgenicsPro1s Brain Sludge"
        >


        <!-- =================================================
             ACTUAL CLICKABLE SHELF OBJECTS WILL GO HERE

             Example:

             <a
                 href="YOUR-REAL-PAGE.html"
                 class="shelf-object"
                 style="
                     left: 20%;
                     top: 50%;
                     width: 120px;
                 "
             >

                 <img
                     src="YOUR-REAL-OBJECT.png"
                     alt="..."
                 >

             </a>

             ================================================= -->



    </main>


    <!-- =================================================
         EVERYTHING AFTER THE SHELF
         ================================================= -->

    <section class="below-shelf">


        <h2>
            HTML BRAIN SLUDGE HAS ESCAPED
        </h2>


        <div class="chaos-content">


            <p>
                blah text and random shit and blinkies and stamps and widgets
            </p>


            <!-- =========================================
                 YOUR EXISTING BLINKIES / STAMPS GO HERE
                 ========================================= -->



        </div>


    </section>


</body>

</html>
