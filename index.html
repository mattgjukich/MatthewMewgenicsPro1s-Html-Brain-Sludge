<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Brain Sludge</title>

<link rel="icon" type="image/png" href="eggyd.png">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #111;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   TOP ROOM / SHELF AREA
   ===================================================== */

.room {

    position: relative;

    width: 100%;

    /*
       This controls how much of the screen the
       photograph takes up before the rest of the
       website begins.
    */

    min-height: 720px;

    background: #ddd;

    overflow: hidden;
}


/* =====================================================
   SHELF PHOTOGRAPH
   ===================================================== */

.room-photo {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    /*
       IMPORTANT:
       Do NOT crop the photograph.
    */

    object-fit: contain;

    object-position: left center;

    user-select: none;

    pointer-events: none;
}


/* =====================================================
   LOGO ON THE WALL
   ===================================================== */

.logo {

    position: absolute;

    /*
       BIGGER THAN BEFORE
    */

    width: 34%;

    max-width: 650px;

    /*
       Position on the empty wall.
       Adjust these if necessary.
    */

    right: 5%;

    top: 20%;

    height: auto;

    z-index: 10;

    user-select: none;

    pointer-events: none;
}


/* =====================================================
   CLICKABLE SHELF OBJECTS
   ===================================================== */

.shelf-object {

    position: absolute;

    z-index: 20;

    display: block;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}


.shelf-object img {

    display: block;

    width: 100%;
    height: auto;

    user-select: none;
}


.shelf-object:hover {

    transform:
        scale(1.08)
        rotate(-2deg);

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 10px lime);
}


/* =====================================================
   EXAMPLE SHELF OBJECT POSITIONS
   ===================================================== */

/*
   These are ONLY examples.

   Once we know the actual pages you want,
   we can put the real objects here.
*/


.projects-object {

    left: 17%;

    top: 28%;

    width: 90px;
}


.krackphone-object {

    left: 28%;

    top: 50%;

    width: 80px;
}


/* =====================================================
   STUFF BELOW THE SHELF
   ===================================================== */

.below-shelf {

    position: relative;

    width: 100%;

    min-height: 500px;

    background:

        repeating-linear-gradient(
            45deg,
            #eeeeee 0px,
            #eeeeee 4px,
            #ffffff 4px,
            #ffffff 8px
        );

    border-top: 8px double #000;

    padding: 30px 20px 80px;

    text-align: center;
}


/* =====================================================
   OLD WEB TEXT
   ===================================================== */

.intro {

    font-family: "Courier New", monospace;

    font-size: 17px;

    margin-bottom: 25px;
}


.blink {

    animation:
        blink 0.8s steps(1) infinite;
}


@keyframes blink {

    50% {
        opacity: 0;
    }

}


/* =====================================================
   BLINKIES / STAMPS AREA
   ===================================================== */

.web-garbage {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    align-items: center;

    gap: 10px;

    max-width: 1200px;

    margin: 0 auto;
}


/*
   Anything you put in here later:

   <img src="gifs/blinkie.gif">
   <img src="stamp.png">

   etc.
*/


.web-garbage img {

    max-width: 180px;

    height: auto;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 800px) {

    .room {

        min-height: 600px;

    }

    .logo {

        width: 42%;

        right: 4%;

        top: 20%;

    }

}

</style>
</head>


<body>


<!-- =====================================================
     SHELF / HERO
     ===================================================== -->

<section class="room">


    <!-- REAL PHOTOGRAPH -->

    <img
        src="theshelf.jpg"
        class="room-photo"
        alt=""
    >


    <!-- LOGO ON WALL -->

    <img
        src="logotake1.gif"
        class="logo"
        alt="HTML Brain Sludge"
    >


    <!-- =================================================
         SHELF NAVIGATION

         PUT YOUR ACTUAL EXISTING PAGES HERE.
         ================================================= -->


    <!-- EXAMPLE:

    <a
        href="YOUR-EXISTING-PAGE.html"
        class="shelf-object projects-object"
    >

        <img
            src="YOUR-OBJECT.png"
            alt="Projects"
        >

    </a>

    -->


</section>



<!-- =====================================================
     BELOW THE SHELF
     ===================================================== -->

<section class="below-shelf">


    <div class="intro">

        <span class="blink">
            HTML BRAIN SLUDGE HAS ESCAPED
        </span>

        <br><br>

        blah text and random shit and blinkies
        and stamps and widgets

    </div>



    <!-- =================================================
         BLINKIES / STAMPS / RANDOM WEB CRAP
         ================================================= -->

    <div class="web-garbage">


        <!--
            PUT YOUR EXISTING BLINKIES / STAMPS HERE.

            Example:

            <img src="bi.webp">
            <img src="10.gif">
            <img src="eatpant.png">

        -->


    </div>


</section>


</body>

</html>
